<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BOOKSPACE</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="checkout">

    <nav>
        <div class="logo">BOOKSPACE</div>

        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Katalog</a>
            <a href="checkout.html">Checkout</a>
            <a href="tracking.html">Tracking</a>
            <a href="laporan.html">Laporan</a>
            <a href="history.html">Riwayat</a>
            <a href="#" class="logout">Logout</a>
        </div>
    </nav>

    <div class="container">

        <h1>Checkout Pesanan</h1>

        <div class="card">

            <form id="formCheckout">

                <label>Nama Pelanggan</label>
                <input type="text" id="nama" required>

                <label>Nomor Telepon</label>
                <input type="tel" id="telepon" required>

                <label>Alamat Pengiriman</label>
                <textarea id="alamat" required></textarea>

                <label>Pilih Buku</label>
                <select id="pilihBuku" required></select>

                <label>Jumlah Buku</label>
                <input type="number" id="jumlah" min="1" value="1" required>

                <label>Metode Pembayaran</label>

                <select id="pembayaran" required>
                    <option value="">Pilih Pembayaran</option>
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="E-Wallet">E-Wallet</option>
                    <option value="COD">COD</option>
                </select>

                <button type="submit">Buat Pesanan</button>

            </form>

        </div>

        <div class="card">

            <h2>Detail Pesanan</h2>

            <div id="hasilPesanan">
                Belum ada pesanan.
            </div>

        </div>

    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
